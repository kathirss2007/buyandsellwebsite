
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReMarket - Used Products</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">♻️ ReMarket</div>
    <button onclick="goSell()">Sell Product</button>
</header>

<section class="hero">
    <h1>Buy Smart. Sell Easy.</h1>
    <p>Find useful second-hand products at affordable prices.</p>

    <input
        class="search"
        id="searchBox"
        placeholder="🔍 Search used products..."
        onkeyup="searchProducts()"
    >
</section>

<section class="categories">

    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Electronics')">📱 Electronics</button>
    <button onclick="filterCategory('Furniture')">🪑 Furniture</button>
    <button onclick="filterCategory('Books')">📚 Books</button>
    <button onclick="filterCategory('Vehicles')">🚲 Vehicles</button>

</section>

<section class="products">

    <h2>⭐ Latest Listings</h2>

    <div class="product-grid" id="productList"></div>

</section>

<section class="sell-section" id="sellSection">

    <div class="sell-box">

        <h2>📦 Sell Your Used Product</h2>

        <input
            type="text"
            id="productName"
            placeholder="Product name"
        >

        <select id="productCategory">
            <option value="">Select category</option>
            <option>Electronics</option>
            <option>Furniture</option>
            <option>Books</option>
            <option>Vehicles</option>
        </select>

        <input
            type="number"
            id="productPrice"
            placeholder="Price ₹"
        >

        <select id="productCondition">
            <option value="">Select condition</option>
            <option>Like New</option>
            <option>Good</option>
            <option>Used</option>
        </select>

        <textarea
            id="productDescription"
            placeholder="Describe your product..."
        ></textarea>

        <button onclick="addProduct()">
            + Publish Listing
        </button>

    </div>

</section>

<footer>
    © 2026 ReMarket | Buy & Sell Used Products
</footer>

<script src="script.js"></script>

</body>
</html>
